services:
  change_bot:
    build: .
    container_name: change_bot
    # Если бот упадет с ошибкой, Docker сам его перезапустит
    restart: always
    # Передаем секреты внутрь контейнера
    env_file:
      - .env
    # Ограничиваем ресурсы, чтобы бот не съел всю память сервера (для твоей Free Tier VM)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - ocr-service

  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: ocr-service
    restart: always
    shm_size: '8gb'
    volumes:
      - ./paddlex_cache:/root/.paddlex
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '2.0'
          memory: 4G
